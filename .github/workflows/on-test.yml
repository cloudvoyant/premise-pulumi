name: Test templates and GCS infrastructure

"on":
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: premise-pulumi-e2e-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
        with:
          version: "2026.10.8"
      - run: mise run test
      - run: mise run lint
      - run: mise run format:check

  live:
    timeout-minutes: 25
    needs: verify
    runs-on: ubuntu-latest
    environment: preview
    env:
      PREMISE_RC_VERSION: ${{ vars.PREMISE_RC_VERSION }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      PULUMI_BACKEND_URL: ${{ vars.PULUMI_BACKEND_URL }}
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require a published compatible RC
        shell: bash
        run: |
          set -euo pipefail
          : "${PREMISE_RC_VERSION:?Set the verified published Premise RC release tag}"
          [[ "$PREMISE_RC_VERSION" == v*-rc.* ]]
      - name: Checkout the exact RC action
        uses: actions/checkout@v6
        with:
          repository: cloudvoyant/premise
          ref: ${{ vars.PREMISE_RC_VERSION }}
          path: .actions/premise
          persist-credentials: false
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Install the published RC binary with its matching action
        uses: ./.actions/premise
        with:
          setup-only: true
          release: none
          install-premise: pre-built
          premise-version: ${{ vars.PREMISE_RC_VERSION }}
      - name: Exercise the local Go GCS fixture
        working-directory: .actions/premise
        env:
          PREMISE_TEST_GCS: "1"
          PREMISE_BIN: pm
        run: mise exec go@1.25 pulumi@3.268.0 -- go test ./e2e -run '^TestInfraGCS$' -count=1 -timeout 20m -v
