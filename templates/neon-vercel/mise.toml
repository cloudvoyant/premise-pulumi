[tools]
node = "22"
pulumi = "3.200.0"

[tasks.install]
run = "pulumi install --non-interactive"

[tasks.build]
run = "npx --no-install tsc"

[tasks.clean]
run = "rm -rf dist"

[tasks.test]
run = ["npx --no-install tsc", "node resource.test.cjs"]

[tasks.lint]
run = "npx --no-install tsc --noEmit"

[tasks."lint:fix"]
run = "npx --no-install tsc --noEmit"

[tasks.format]
run = "npx --yes prettier@3.6.2 --write '*.ts' '*.json' '*.yaml'"

[tasks."format:check"]
run = "npx --yes prettier@3.6.2 --check '*.ts' '*.json' '*.yaml'"
