[tools]
go = "1.25"
pulumi = "3.268.0"
[tasks.install]
run = ["pulumi package gen-sdk terraform-provider@1.4.0 --language go --local --out sdks/neon -- kislerdm/neon 0.18.0", "go mod tidy"]
[tasks.test]
run = "go test ./..."
[tasks.lint]
run = "go vet ./..."
[tasks.format]
run = "gofmt -w *.go"
[tasks."format:check"]
run = 'test -z "$(gofmt -l *.go)"'

[tasks.build]
depends = ["install"]
run = "go build -o /dev/null ."

[tasks."lint:fix"]
run = "gofmt -w *.go && go vet ./..."
