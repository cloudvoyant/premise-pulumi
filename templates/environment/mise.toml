[tools]
go = "1.25"
[tasks.install]
run = "go mod download"
[tasks.test]
run = "go test ./..."
[tasks.lint]
run = "go vet ./..."
[tasks.format]
run = "gofmt -w *.go"
[tasks."format:check"]
run = 'test -z "$(gofmt -l *.go)"'

[tasks.build]
run = "go build -o /dev/null ."

[tasks."lint:fix"]
run = "gofmt -w *.go && go vet ./..."
