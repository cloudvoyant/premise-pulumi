workspace:
  name: premise-pulumi
  kind: template-registry
  schema-version: "0.2"
  providers:
    ci: github
    tools: mise
    tasks: mise
    infra: pulumi
    versioning: svu
  projects: []
template_registry:
  workspace_files: []
  templates:
    - name: gcs-bucket
      kind: infra
      path: templates/gcs-bucket
      version: 0.1.0
      infra:
        role: program
        scope: environment
      questions:
        - prompt: Infrastructure project name
          type: string
          populate: name
      substitutions:
        premise-bucket: name
    - name: neon-vercel
      kind: infra
      path: templates/neon-vercel
      version: 0.1.0
      infra:
        role: program
        scope: environment
      questions:
        - prompt: Infrastructure program name
          type: string
          populate: name
      substitutions:
        premise-web: name
